[package]
name = "sevenbeing_ads1299_native"
version = "0.1.0"
edition = "2021"
description = "Rust accel for ADS1299 USBStyx frame decode"
license = "MIT"

[lib]
name = "sevenbeing_ads1299_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
